name: Freescale Semiconductor
description: >-
  Freescale Semiconductor, Inc. was an American semiconductor manufacturer headquartered in Austin,
  Texas, created in 2004 from the spin-off of Motorola's Semiconductor Products Sector. Freescale
  designed and produced embedded processing hardware — microcontrollers (Kinetis, S08), i.MX
  applications processors, ColdFire and QorIQ/PowerPC communications processors, digital signal
  processors, RF, analog, and sensor products — for the automotive, networking, industrial, and
  consumer markets. In December 2015 Freescale merged with NXP Semiconductors in a roughly $11.8B deal
  and ceased to exist as an independent company; its freescale.com domain now redirects to nxp.com.
  Freescale was a hardware/silicon company, not a web-API provider: it published no public REST/HTTP
  API, developer portal, or OpenAPI, so there is no live API surface for the enrichment pipeline to
  harvest.
